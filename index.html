<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой новостной дайджест</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; color: #333; }
        .block { background: white; padding: 1.5rem; margin-bottom: 2rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { border-bottom: 2px solid #2563eb; padding-bottom: 0.5rem; color: #1e40af; }
        .news-item { margin-bottom: 0.6rem; line-height: 1.5; }
        .news-item a { text-decoration: none; color: #2563eb; }
        .news-item a:hover { text-decoration: underline; }
        .analysis { background: #f0f7ff; padding: 1rem 1.2rem; border-left: 4px solid #2563eb; margin-top: 1.5rem; border-radius: 6px; }
        .analysis h3 { margin-top: 0; color: #1e40af; font-size: 1rem; }
        .timestamp { color: #888; font-size: 0.85rem; text-align: center; margin-top: 2rem; }
    </style>
</head>
<body>

<h1>📰 Дайджест новостей</h1>

<div class="block" id="tech-block">
    <h2>💻 Технологии</h2>
    <div class="news-list" id="tech-news"><p>Загрузка...</p></div>
    <div class="analysis" id="tech-analysis"><p>Анализ появится после первого запуска...</p></div>
</div>

<div class="block" id="science-block">
    <h2>🔬 Наука</h2>
    <div class="news-list" id="science-news"><p>Загрузка...</p></div>
    <div class="analysis" id="science-analysis"><p>Анализ появится после первого запуска...</p></div>
</div>

<div class="timestamp" id="timestamp"></div>

</body>
</html>
